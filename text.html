<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Untitled — Text Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/compromise@14.14.4/builds/compromise.min.js"></script>
  <style>
    :root {
      --bg-studio: #eef2f6;
      --bg-paper: #ffffff;
      --border-subtle: #dde4ee;
      --text-main: #111827;
      --text-muted: #64748b;
      --accent-blue: #2563eb;
      --accent-red: #dc2626;
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-studio);
      color: var(--text-main);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ============================
       MAIN EDITOR STAGE (FOV SHIFT)
       ============================ */
    #app-stage {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 20px 16px;
      perspective: 1200px;
      transform-style: preserve-3d;
      transition:
        transform 0.48s cubic-bezier(0.16, 1, 0.3, 1),
        filter 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform, filter;
    }

    body.modal-active #app-stage {
      transform: scale(0.905) translateZ(-75px) rotateX(1.7deg);
      filter: blur(5px) brightness(0.42) saturate(0.75);
      pointer-events: none;
    }

    .topbar {
      width: 100%;
      max-width: 940px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #0f172a;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.01em;
      user-select: none;
    }

    #filename-input {
      border: 1px solid transparent;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 6px;
      width: 165px;
      transition: border-color 0.15s, background 0.15s;
    }

    #filename-input:hover { background: #f1f5f9; }
    #filename-input:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--accent-blue);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border-subtle);
      background: #ffffff;
      color: #334155;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.16s ease;
      user-select: none;
    }

    .btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #0f172a;
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .btn.active-toggle {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .btn-primary {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1e293b;
      border-color: #1e293b;
      color: #ffffff;
    }

    .revealed-after-roll {
      display: none;
    }
    .revealed-after-roll.shown {
      display: inline-flex;
      animation: fadeInChip 0.35s ease;
    }
    @keyframes fadeInChip {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Paper Sheet & Layered Editor */
    .paper-shell {
      width: 100%;
      max-width: 940px;
      flex: 1;
      min-height: 0;
      background: var(--bg-paper);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: 0 12px 34px rgba(15, 23, 42, 0.05);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .editor-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    /* Pixel-locked Sans-Serif typography between mirror & textarea */
    .editor-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 36px 46px;
      border: 0;
      font-family: var(--font-sans);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.75;
      letter-spacing: 0px;
      font-kerning: normal;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
      tab-size: 4;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      overflow-y: scroll;
      scrollbar-gutter: stable;
      box-sizing: border-box;
    }

    #editor-mirror {
      z-index: 1;
      color: var(--text-main);
      pointer-events: none;
      user-select: none;
      background: transparent;
      scrollbar-color: transparent transparent;
    }

    #editor-mirror::-webkit-scrollbar { width: 12px; }
    #editor-mirror::-webkit-scrollbar-thumb,
    #editor-mirror::-webkit-scrollbar-track { background: transparent; }

    #editor-textarea {
      z-index: 2;
      background: transparent;
      color: transparent;
      caret-color: #0f172a;
      resize: none;
      outline: none;
    }

    #editor-textarea::selection {
      background: rgba(37, 99, 235, 0.2);
      color: transparent;
    }

    #editor-textarea::-webkit-scrollbar { width: 12px; }
    #editor-textarea::-webkit-scrollbar-track { background: transparent; }
    #editor-textarea::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
      border: 3px solid transparent;
      background-clip: content-box;
    }

    #editor-textarea.anim-hide-caret { caret-color: transparent; }

    .editor-placeholder {
      position: absolute;
      top: 36px;
      left: 46px;
      right: 46px;
      font-family: var(--font-sans);
      font-size: 17px;
      font-weight: 500;
      line-height: 1.75;
      color: #94a3b8;
      pointer-events: none;
      z-index: 0;
      transition: opacity 0.2s ease;
    }
    .editor-placeholder.hidden { opacity: 0; }

    .statusbar {
      width: 100%;
      max-width: 940px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 6px 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      flex-shrink: 0;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* ============================
       IN-EDITOR MORPH ANIMATIONS (BLUE & RED)
       ============================ */
    .token-lock-target {
      display: inline;
      color: #111827;
      transition: color 0.2s ease, text-shadow 0.2s ease, background 0.2s ease;
      border-radius: 5px;
    }

    .token-lock-target.pre-blue {
      color: var(--accent-blue);
      text-shadow: 0 0 10px rgba(37, 99, 235, 0.35);
      background: rgba(37, 99, 235, 0.14);
      box-shadow: 0 0 10px 3px rgba(37, 99, 235, 0.22);
    }

    .token-lock-target.pre-red {
      color: var(--accent-red);
      text-shadow: 0 0 10px rgba(220, 38, 38, 0.4);
      background: rgba(220, 38, 38, 0.15);
      box-shadow: 0 0 10px 3px rgba(220, 38, 38, 0.25);
    }

    .morph-pill {
      display: inline-flex;
      align-items: baseline;
      vertical-align: baseline;
      position: relative;
      transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: pre;
    }

    .morph-blur-bar {
      position: absolute;
      inset: -1px -5px;
      border-radius: 7px;
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.42), rgba(59, 130, 246, 0.58), rgba(37, 99, 235, 0.42));
      box-shadow: 0 0 18px rgba(37, 99, 235, 0.55);
      filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.22s ease, filter 0.34s ease, transform 0.34s ease;
    }

    .morph-blur-bar.red-theme {
      background: linear-gradient(90deg, rgba(220, 38, 38, 0.45), rgba(239, 68, 68, 0.62), rgba(220, 38, 38, 0.45));
      box-shadow: 0 0 18px rgba(220, 38, 38, 0.6);
    }

    .morph-blur-bar.visible { opacity: 1; filter: blur(4px); }
    .morph-blur-bar.fade-out {
      opacity: 0;
      filter: blur(11px);
      transform: scale(1.06, 0.92);
    }

    .morph-new-word {
      display: inline-block;
      color: var(--accent-blue);
      opacity: 0;
      transform: translateY(2px) scale(0.95);
      transition:
        opacity 0.18s ease,
        color 0.44s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 1;
    }

    .morph-new-word.red-theme {
      color: var(--accent-red);
    }

    .morph-new-word.revealed {
      opacity: 1;
      transform: translateY(-4px) scale(1.06);
    }

    .morph-new-word.settled {
      opacity: 1;
      transform: translateY(0) scale(1);
      color: var(--text-main);
    }

    /* ============================
       IMMERSIVE ROULETTE MODAL + SHAKE + RARITY
       ============================ */
    #roulette-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(circle at 50% 45%, rgba(15, 23, 42, 0.64), rgba(3, 7, 18, 0.88));
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #roulette-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    #shake-wrapper {
      width: 100%;
      max-width: 810px;
      display: flex;
      justify-content: center;
      will-change: transform;
    }

    #roulette-modal {
      width: 100%;
      background: linear-gradient(165deg, #0f172a 0%, #152036 55%, #0a101f 100%);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 22px;
      padding: 24px 26px 22px;
      box-shadow:
        0 32px 95px rgba(0, 0, 0, 0.72),
        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
        0 0 60px rgba(37, 99, 235, 0.16);
      color: #f8fafc;
      transform: scale(0.68) translateY(28px);
      opacity: 0;
      transition:
        transform 0.44s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.35s ease;
      will-change: transform, opacity;
      position: relative;
      overflow: hidden;
    }

    #roulette-modal.delete-mode {
      background: linear-gradient(165deg, #1b0c12 0%, #241018 55%, #12080c 100%);
      border-color: rgba(248, 113, 113, 0.32);
      box-shadow:
        0 32px 95px rgba(0, 0, 0, 0.75),
        0 0 60px rgba(220, 38, 38, 0.22);
    }

    #roulette-backdrop.open #roulette-modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    #roulette-modal.pop-into-editor {
      transition:
        transform 0.34s cubic-bezier(0.55, 0.05, 0.35, 1),
        opacity 0.28s ease-in !important;
      opacity: 0 !important;
    }

    /* High Rarity Modal Borders */
    #roulette-modal.rarity-glow-epic {
      border-color: #a855f7;
      box-shadow: 0 0 70px rgba(168, 85, 247, 0.48), 0 30px 90px rgba(0, 0, 0, 0.75);
    }
    #roulette-modal.rarity-glow-legendary {
      border-color: #fbbf24;
      box-shadow: 0 0 85px rgba(245, 158, 11, 0.62), 0 30px 90px rgba(0, 0, 0, 0.8);
    }
    #roulette-modal.rarity-glow-mythic {
      border-color: #f43f5e;
      box-shadow:
        0 0 95px rgba(236, 72, 153, 0.72),
        0 0 140px rgba(56, 189, 248, 0.35),
        0 30px 90px rgba(0, 0, 0, 0.85);
    }

    /* Intrusive High-Rarity Celebration Banner Overlay */
    #rarity-intrusion {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      opacity: 0;
      transform: scale(1.7);
      transition: opacity 0.22s ease, transform 0.38s cubic-bezier(0.22, 1.4, 0.36, 1);
    }

    #rarity-intrusion.active {
      opacity: 1;
      transform: scale(1);
    }

    .rarity-burst-backdrop {
      position: absolute;
      inset: 0;
      opacity: 0.28;
    }

    .rarity-stamp {
      position: relative;
      padding: 10px 26px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.45);
      transform: rotate(-2deg);
    }

    .rarity-stamp.tier-epic {
      background: linear-gradient(135deg, #7e22ce, #a855f7);
    }
    .rarity-stamp.tier-legendary {
      background: linear-gradient(135deg, #d97706, #fbbf24, #f59e0b);
      color: #1e1200;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .rarity-stamp.tier-mythic {
      background: linear-gradient(125deg, #ec4899, #8b5cf6, #06b6d4, #f43f5e);
      background-size: 250% 250%;
      animation: mythicShimmer 1.6s linear infinite;
    }
    @keyframes mythicShimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .rarity-pct-popup {
      position: relative;
      margin-top: 8px;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      color: #fde68a;
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
      display: none;
    }
    .rarity-pct-popup.visible {
      display: inline-block;
      animation: popBadge 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popBadge {
      from { opacity: 0; transform: scale(0.5) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .modal-tags {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag-chip {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .tag-pos {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #7dd3fc;
    }

    .tag-pos.delete-chip {
      background: rgba(248, 113, 113, 0.16);
      border-color: rgba(248, 113, 113, 0.4);
      color: #fca5a5;
    }

    .tag-odds {
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.38);
      color: #fcd34d;
    }

    .tag-source {
      background: rgba(148, 163, 184, 0.14);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
    }

    .typed-preview {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .typed-preview strong {
      font-family: var(--font-sans);
      color: #fde68a;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.28);
      padding: 2px 10px;
      border-radius: 7px;
      font-size: 14px;
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Roulette Track */
    .roulette-viewport {
      position: relative;
      width: 100%;
      height: 136px;
      border-radius: 14px;
      background: linear-gradient(180deg, #070b14 0%, #0d1424 50%, #070b14 100%);
      border: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: inset 0 8px 24px rgba(0, 0, 0, 0.78);
      overflow: hidden;
      display: flex;
      align-items: center;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
    }

    .needle-overlay {
      position: relative;
      width: 100%;
      height: 0;
      pointer-events: none;
      z-index: 15;
    }

    .needle-line {
      position: absolute;
      left: 50%;
      top: -136px;
      width: 3px;
      height: 136px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #fbbf24 0%, #38bdf8 50%, #fbbf24 100%);
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.85), 0 0 28px rgba(56, 189, 248, 0.45);
    }

    .needle-cap-top,
    .needle-cap-bottom {
      position: absolute;
      left: 50%;
      width: 0;
      height: 0;
      border-left: 9px solid transparent;
      border-right: 9px solid transparent;
      transform: translateX(-50%);
      transition: transform 0.08s ease-out;
    }

    .needle-cap-top {
      top: -139px;
      border-top: 11px solid #fbbf24;
      filter: drop-shadow(0 2px 6px rgba(251, 191, 36, 0.8));
    }

    .needle-cap-bottom {
      top: -8px;
      border-bottom: 11px solid #fbbf24;
      filter: drop-shadow(0 -2px 6px rgba(251, 191, 36, 0.8));
    }

    .needle-cap-top.tick-kick {
      transform: translateX(-50%) rotate(-11deg) scale(1.12);
    }

    #roulette-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      will-change: transform;
      padding: 0;
    }

    .slot-card {
      flex: 0 0 156px;
      width: 156px;
      height: 98px;
      border-radius: 12px;
      padding: 10px 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: linear-gradient(160deg, #1e293b, #141c2f);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-bottom: 4px solid #64748b;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      user-select: none;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, border-color 0.3s ease;
    }

    /* Rarity Card Styling */
    .slot-card.tier-original {
      background: linear-gradient(160deg, #2b2210, #19140a);
      border-color: rgba(251, 191, 36, 0.42);
      border-bottom-color: #eab308;
    }
    .slot-card.tier-common {
      background: linear-gradient(160deg, #1b283a, #121b29);
      border-bottom-color: #38bdf8;
    }
    .slot-card.tier-uncommon {
      background: linear-gradient(160deg, #112b26, #0a1b18);
      border-color: rgba(16, 185, 129, 0.32);
      border-bottom-color: #10b981;
    }
    .slot-card.tier-rare {
      background: linear-gradient(160deg, #17254a, #0e1730);
      border-color: rgba(59, 130, 246, 0.4);
      border-bottom-color: #3b82f6;
    }
    .slot-card.tier-epic {
      background: linear-gradient(160deg, #2b1745, #180d28);
      border-color: rgba(168, 85, 247, 0.48);
      border-bottom-color: #a855f7;
    }
    .slot-card.tier-legendary {
      background: linear-gradient(160deg, #422607, #241404);
      border-color: rgba(251, 191, 36, 0.65);
      border-bottom-color: #f59e0b;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.28);
    }
    .slot-card.tier-mythic {
      background: linear-gradient(145deg, #3b0d2c, #241142, #0d2b3b);
      border-color: rgba(244, 63, 94, 0.72);
      border-bottom-color: #ec4899;
      box-shadow: 0 0 22px rgba(236, 72, 153, 0.4);
    }

    .slot-card.winner-card {
      transform: scale(1.11);
      z-index: 6;
      border-color: #ffffff;
      box-shadow: 0 0 32px rgba(59, 130, 246, 0.72), 0 0 54px rgba(255, 255, 255, 0.25);
    }
    .slot-card.tier-epic.winner-card {

    function inflectPlural(noun) {

        if (/e$/i.test(base)) return base + 'd';
        if (/[^aeiou]y$/i.test(base)) return base.slice(0, -1) + 'ied';

    function levenshtein(a, b) {
      const m = a.length, n = b.length;
      const dp = new Array(n + 1);
      for (let j = 0; j <= n; j++) dp[j] = j;
      for (let i = 1; i <= m; i++) {
        let prev = dp[0];
        dp[0] = i;
        for (let j = 1; j <= n; j++) {
          const temp = dp[j];
          dp[j] = a[i - 1] === b[j - 1]
            ? prev
            : 1 + Math.min(prev, dp[j], dp[j - 1]);
          prev = temp;
        }
      }
      return dp[n];
    }

    function hamming(a, b) {
      let diff = 0;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) diff++;
      }
      return diff;
    }

      const lower = fragment.toLowerCase();
      if (VALID_WORDS.has(lower)) {
        return matchCase(originalCaseSource || fragment, lower);
      }

      const len = lower.length;
      if (len === 1) {
        return originalCaseSource && /^[A-Z]/.test(originalCaseSource) ? 'I' : (Math.random() < 0.6 ? 'a' : 'I');
      }

      const pool = WORDS_BY_LEN.get(len);
      if (!pool || pool.size === 0) return fragment;

      let bestScore = Infinity;
      let bestCandidates = [];

      for (const cand of pool) {
        const h = hamming(lower, cand);
        if (h > bestScore + 1) continue;
        const lev = levenshtein(lower, cand);
        const prefixBonus = cand[0] === lower[0] ? -0.15 : 0;
        const commonBonus = COMMON_SHORT_SET.has(cand) ? -0.25 : 0;
        const score = h + lev * 0.2 + prefixBonus + commonBonus;

        if (score < bestScore - 0.001) {
          bestScore = score;
          bestCandidates = [cand];
        } else if (Math.abs(score - bestScore) <= 0.001) {
          bestCandidates.push(cand);
        }
      }

      const chosen = bestCandidates.length > 0
        ? bestCandidates[Math.floor(Math.random() * bestCandidates.length)]
        : lower;

      return matchCase(originalCaseSource || fragment, chosen);
    }

    /* =========================================================================
       3. CASE MATCHING, VOWEL HARMONY & SYNTACTIC COHERENCE CLASSIFIER
       ========================================================================= */
    function matchCase(original, replacement) {
      if (!original || !replacement) return replacement;
      if (/\s/.test(replacement)) {
        // Multi-word replacement like "to lowkey": preserve initial cap only if original was capitalized
        if (/^[A-Z]/.test(original) && original.length > 1 && original === original.toUpperCase()) {
          return replacement.toUpperCase();
        }
        if (/^[A-Z]/.test(original)) {
          return replacement.charAt(0).toUpperCase() + replacement.slice(1).toLowerCase();
        }
        return replacement.toLowerCase();
      }

      const letters = original.replace(/[^a-zA-Z]/g, '');
      if (!letters) return replacement;

      if (letters.length === 1 && letters === letters.toUpperCase()) {
        return replacement.charAt(0).toUpperCase() + replacement.slice(1).toLowerCase();
      }
      if (letters.length > 1 && letters === letters.toUpperCase()) {
        return replacement.toUpperCase();
      }
      if (letters === letters.toLowerCase()) {
        return replacement.toLowerCase();
      }
      if (
        original.charAt(0) === original.charAt(0).toUpperCase() &&
        original.slice(1) === original.slice(1).toLowerCase()
      ) {
        return replacement.charAt(0).toUpperCase() + replacement.slice(1).toLowerCase();
      }
      let res = '';
      const origChars = [...original];
      const repChars = [...replacement.toLowerCase()];
      for (let i = 0; i < repChars.length; i++) {
        const ch = repChars[i];
        if (i < origChars.length) {
          const oc = origChars[i];
          res += (oc !== oc.toLowerCase() && oc === oc.toUpperCase()) ? ch.toUpperCase() : ch.toLowerCase();
        } else {
          res += ch.toLowerCase();
        }
      }
      return res;
    }

    function startsWithVowelSound(word) {
      if (!word) return false;
      const w = word.toLowerCase();
      if (/^(uni|use|usu|uk|euro|one)/.test(w)) return false;
      if (/^(hour|honest|honor|heir|herb)/.test(w)) return true;
      return /^[aeiou]/.test(w);
    }

    function looksLikeDeterminer(w) {
      if (!w) return false;
      const l = w.toLowerCase();
      return DICT.det_sg.has(l) || DICT.det_pl.has(l) || DICT.pronoun_poss_det.has(l) || DICT.number_word.has(l) || /^\d+$/.test(l);
    }

    function looksLikeAdjective(w) {
      if (!w) return false;
      const l = w.toLowerCase();
      if (DICT.adj_base.has(l) || DICT.adj_comparative.has(l) || DICT.adj_superlative.has(l)) return true;
      if (hasNLP) {
        try { if (window.nlp(l).has('#Adjective')) return true; } catch {}
      }
      return /(ous|ful|less|able|ible|ish|ive|ic|al|y|ed|ing)$/i.test(l) && !DICT.noun_singular.has(l);
    }

    function looksLikePluralNoun(w) {
      if (!w) return false;
      const l = w.toLowerCase();
      if (DICT.noun_plural.has(l)) return true;
      if (hasNLP) {
        try { if (window.nlp(l).has('#Plural')) return true; } catch {}
      }
      return l.endsWith('s') && !l.endsWith('ss') && l.length > 3 && !DICT.verb_present3s.has(l);
    }

    function looksLikeDirectObjectStart(nextWord) {
      if (!nextWord) return false;
      const l = nextWord.toLowerCase();
      if (looksLikeDeterminer(l) || DICT.pronoun_obj.has(l) || DICT.pronoun_indef.has(l) || DICT.pronoun_refl.has(l)) return true;
      if (DICT.noun_singular.has(l) || DICT.noun_plural.has(l) || DICT.noun_mass.has(l)) return true;
      if (looksLikeAdjective(l)) return true;
      return false;
    }

    function classifyWord(token, fullText) {
      const word = token.text;
      const lower = word.toLowerCase();
      const prevLower = (token.prevWord || '').toLowerCase();
      const prev2Lower = (token.prev2Word || '').toLowerCase();
      const nextLower = (token.nextWord || '').toLowerCase();
      const isCapitalized = /^[A-Z]/.test(word);

      // URL / TLD
      if (token.precededByDot && TLD_SET.has(lower)) {
        return { category: 'tld', label: 'DOMAIN TLD', dmPos: null, predictive: false };
      }

      // Subject pronouns with verb agreement!
      if (BANKS.pronoun_subj_all.includes(lower) || word === 'I') {
        if (['is','was','has','does'].includes(nextLower) || (nextLower.endsWith('s') && DICT.verb_present3s.has(nextLower))) {
          return { category: 'pronoun_subj_3s', label: 'PRONOUN (3S)', dmPos: null, predictive: false };
        }
        if (['are','were'].includes(nextLower)) {
          return { category: 'pronoun_subj_pl', label: 'PRONOUN (PL)', dmPos: null, predictive: false };
        }
        if (['am'].includes(nextLower)) {
          return { category: 'pronoun_subj_all', label: 'PRONOUN', dmPos: null, predictive: false, customPool: ['I'] };
        }
        if (['have','do'].includes(nextLower) || DICT.verb_base.has(nextLower)) {
          return { category: 'pronoun_subj_all', label: 'PRONOUN', dmPos: null, predictive: false, customPool: ['I','you','we','they'] };
        }
        return { category: 'pronoun_subj_all', label: 'PRONOUN', dmPos: null, predictive: false };
      }

      if (BANKS.pronoun_obj.includes(lower)) return { category: 'pronoun_obj', label: 'OBJECT PRONOUN', dmPos: null, predictive: false };
      if (BANKS.pronoun_poss_det.includes(lower)) return { category: 'pronoun_poss_det', label: 'POSSESSIVE', dmPos: null, predictive: false };
      if (BANKS.pronoun_poss_pro.includes(lower)) return { category: 'pronoun_poss_pro', label: 'POSSESSIVE', dmPos: null, predictive: false };
      if (BANKS.pronoun_refl.includes(lower)) return { category: 'pronoun_refl', label: 'REFLEXIVE', dmPos: null, predictive: false };
      if (BANKS.pronoun_indef.includes(lower)) return { category: 'pronoun_indef', label: 'PRONOUN', dmPos: null, predictive: false };

      // Infinitive "to" before verb vs directional preposition "to"
      if (lower === 'to') {
        if (nextLower && (DICT.verb_base.has(nextLower) || (hasNLP && window.nlp(nextLower).has('#Infinitive')))) {
          return {
            category: 'infinitive_to',
            label: 'INFINITIVE',
            dmPos: null,
            predictive: false,
            customPool: ['to','to lowkey','to deadass','to casually','to aggressively','to secretly','to immediately']
          };
        }
        return {
          category: 'preposition',
          label: 'PREPOSITION',
          dmPos: null,
          predictive: false,
          customPool: ['to','towards','into','near','past','through','around','beside','behind']
        };
      }

      // Copula & Progressive Auxiliary (strict tense + -ing distinction!)
      const nextIsGerund = nextLower.endsWith('ing') && !['interesting','boring','amazing','annoying','exciting','terrifying','confusing','charming'].includes(nextLower);
      if (['is','becomes','seems','remains','appears'].includes(lower)) {
        return nextIsGerund && lower === 'is'
          ? { category: 'prog_3s_pres', label: 'AUXILIARY', dmPos: null, predictive: false }
          : { category: 'copula_3s_pres', label: 'LINKING VERB', dmPos: null, predictive: false };
      }
      if (['was','became','seemed','remained','appeared'].includes(lower)) {
        return nextIsGerund && lower === 'was'
          ? { category: 'prog_3s_past', label: 'AUXILIARY', dmPos: null, predictive: false }
          : { category: 'copula_3s_past', label: 'LINKING VERB', dmPos: null, predictive: false };
      }
      if (lower === 'are') {
        return nextIsGerund
          ? { category: 'prog_pl_pres', label: 'AUXILIARY', dmPos: null, predictive: false }
          : { category: 'copula_pl_pres', label: 'LINKING VERB', dmPos: null, predictive: false };
      }
      if (lower === 'were') {
        return nextIsGerund
          ? { category: 'prog_pl_past', label: 'AUXILIARY', dmPos: null, predictive: false }
          : { category: 'copula_pl_past', label: 'LINKING VERB', dmPos: null, predictive: false };
      }
      if (lower === 'am') {
        return nextIsGerund
          ? { category: 'prog_1s_pres', label: 'AUXILIARY', dmPos: null, predictive: false }
          : { category: 'copula_1s_pres', label: 'LINKING VERB', dmPos: null, predictive: false };
      }

      // Auxiliary do / have / negation / wh-words
      if (lower === 'do') return { category: 'aux_do_pres', label: 'AUXILIARY', dmPos: null, predictive: false };
      if (lower === 'does') return { category: 'aux_do_3s', label: 'AUXILIARY', dmPos: null, predictive: false };
      if (lower === 'did') return { category: 'aux_do_past', label: 'AUXILIARY', dmPos: null, predictive: false };
      if (lower === 'have' && (DICT.verb_past.has(nextLower) || nextLower === 'been' || nextLower === 'to')) {
        return { category: 'aux_have_pres', label: 'AUXILIARY', dmPos: null, predictive: false };
      }
      if (lower === 'has' && (DICT.verb_past.has(nextLower) || nextLower === 'been' || nextLower === 'to')) {
        return { category: 'aux_have_3s', label: 'AUXILIARY', dmPos: null, predictive: false };
      }
      if (lower === 'had' && (DICT.verb_past.has(nextLower) || nextLower === 'been' || nextLower === 'to')) {
        return { category: 'aux_have_past', label: 'AUXILIARY', dmPos: null, predictive: false };
      }
      if (BANKS.negation.includes(lower)) return { category: 'negation', label: 'NEGATION', dmPos: null, predictive: false };
      if (BANKS.wh_word.includes(lower)) return { category: 'wh_word', label: 'QUESTION WORD', dmPos: null, predictive: false };

      // Determiners with singular/plural + a/an harmony
      if (DICT.det_sg.has(lower) || DICT.det_pl.has(lower)) {
        if (looksLikePluralNoun(nextLower) && DICT.det_pl.has(lower)) {
          return { category: 'det_pl', label: 'DETERMINER', dmPos: null, predictive: false };
        }
        let customDet = BANKS.det_sg.filter(d => d !== 'a' && d !== 'an');
        if (nextLower) {
          customDet.push(startsWithVowelSound(nextLower) ? 'an' : 'a');
        }
        return { category: 'det_sg', label: 'DETERMINER', dmPos: null, predictive: false, customPool: customDet };
      }

      // Closed grammatical classes
      if (BANKS.modal.includes(lower)) return { category: 'modal', label: 'MODAL VERB', dmPos: null, predictive: false };
      if (BANKS.conj_coord.includes(lower)) return { category: 'conj_coord', label: 'CONJUNCTION', dmPos: null, predictive: false };
      if (BANKS.conj_sub.includes(lower)) return { category: 'conj_sub', label: 'SUBJUNCTION', dmPos: null, predictive: false };
      if (BANKS.preposition.includes(lower)) return { category: 'preposition', label: 'PREPOSITION', dmPos: null, predictive: false };
      if (BANKS.interjection.includes(lower)) return { category: 'interjection', label: 'EXCLAMATION', dmPos: null, predictive: false };
      if (BANKS.number_word.includes(lower)) return { category: 'number_word', label: 'NUMBER WORD', dmPos: null, predictive: false };
      if (BANKS.ordinal_word.includes(lower)) return { category: 'ordinal_word', label: 'ORDINAL WORD', dmPos: null, predictive: false };

      // Degree Adverbs / Intensifiers (e.g., "very interesting", "lowkey goofy")
      if (DICT.adv_degree.has(lower) && (!nextLower || looksLikeAdjective(nextLower) || DICT.adv_degree.has(nextLower) || DICT.adv.has(nextLower))) {
        return { category: 'adv_degree', label: 'INTENSIFIER', dmPos: 'adv', predictive: false };
      }

      // Named Entities
      if (COMPANY_SET.has(lower) && (isCapitalized || /\b(at|for|inc|corp|ceo|stock|app|company)\b/i.test(prevLower))) {
        return { category: 'company', label: 'COMPANY / BRAND', dmPos: null, predictive: false };
      }
      if (FIRST_NAME_SET.has(lower) && isCapitalized) return { category: 'firstName', label: 'PERSON FIRST NAME', dmPos: null, predictive: false };
      if (LAST_NAME_SET.has(lower) && isCapitalized) return { category: 'lastName', label: 'PERSON LAST NAME', dmPos: null, predictive: false };
      if (PLACE_SET.has(lower) && isCapitalized) return { category: 'place', label: 'LOCATION', dmPos: null, predictive: false };

      // Contextual NLP tagging
      let detected = null;
      if (hasNLP) {
        try {
          const ctxStart = Math.max(0, token.start - 150);
          const ctxEnd = Math.min(fullText.length, token.end + 100);
          const doc = window.nlp(fullText.slice(ctxStart, ctxEnd));
          const terms = doc.terms().json();

          let bestTags = null;
          let bestDist = Infinity;
          let running = ctxStart;
          for (const entry of terms) {
            const t = entry.terms && entry.terms[0] ? entry.terms[0] : entry;
            const tText = t.text || '';
            const idx = fullText.indexOf(tText, Math.max(ctxStart, running - 4));
            if (idx !== -1) running = idx + tText.length;
            if (tText.toLowerCase() === lower || (t.normal && t.normal === lower)) {
              const dist = Math.abs((idx === -1 ? token.start : idx) - token.start);
              if (dist < bestDist) {
                bestDist = dist;
                bestTags = new Set(t.tags || []);
              }
            }
          }

          if (bestTags) {
            if (bestTags.has('Organization') || bestTags.has('Company')) return { category: 'company', label: 'COMPANY / ORG', dmPos: null, predictive: false };
            if (bestTags.has('FirstName')) return { category: 'firstName', label: 'PERSON FIRST NAME', dmPos: null, predictive: false };
            if (bestTags.has('LastName')) return { category: 'lastName', label: 'PERSON LAST NAME', dmPos: null, predictive: false };
            if (bestTags.has('Person')) return { category: 'firstName', label: 'PERSON NAME', dmPos: null, predictive: false };
            if (bestTags.has('Place') || bestTags.has('City') || bestTags.has('Country')) return { category: 'place', label: 'LOCATION', dmPos: null, predictive: false };
            if (bestTags.has('Adverb')) detected = { category: 'adv', label: 'ADVERB', dmPos: 'adv', predictive: true };
            else if (bestTags.has('Comparative')) detected = { category: 'adj_comparative', label: 'COMPARATIVE ADJ', dmPos: 'adj', predictive: true };
            else if (bestTags.has('Superlative')) detected = { category: 'adj_superlative', label: 'SUPERLATIVE ADJ', dmPos: 'adj', predictive: true };
            else if (bestTags.has('Adjective')) detected = { category: 'adj_base', label: 'ADJECTIVE', dmPos: 'adj', predictive: true };
            else if (bestTags.has('Gerund')) detected = { category: 'verb_gerund', label: 'VERB (-ING)', dmPos: 'v', predictive: true };
            else if (bestTags.has('PastTense')) detected = { category: 'verb_past', label: 'PAST TENSE VERB', dmPos: 'v', predictive: true };
            else if (bestTags.has('PresentTense') && lower.endsWith('s') && !lower.endsWith('ss')) detected = { category: 'verb_present3s', label: 'VERB (3RD PERSON)', dmPos: 'v', predictive: true };
            else if (bestTags.has('Verb') || bestTags.has('Infinitive')) detected = { category: 'verb_base', label: 'VERB', dmPos: 'v', predictive: true };
            else if (bestTags.has('Plural')) detected = { category: 'noun_plural', label: 'PLURAL NOUN', dmPos: 'n', predictive: true };
            else if (bestTags.has('Noun') || bestTags.has('Singular')) detected = { category: 'noun_singular', label: 'NOUN', dmPos: 'n', predictive: true };
          }
        } catch {}
      }

      // Syntactic guards that enforce sentence coherence!
      // 1. After degree intensifier ("very", "lowkey") -> MUST be adjective (or degree adverb if another adj follows)
      if (DICT.adv_degree.has(prevLower)) {
        if (nextLower && looksLikeAdjective(nextLower) && (DICT.adv_degree.has(lower) || lower.endsWith('ly'))) {
          detected = { category: 'adv_degree', label: 'INTENSIFIER', dmPos: 'adv', predictive: false };
        } else {
          detected = { category: 'adj_base', label: 'ADJECTIVE', dmPos: 'adj', predictive: true };
        }
      }

      // 2. Adverb immediately before an adjective -> use degree adverb pool so "is [adv] interesting" stays coherent
      if (detected && detected.category === 'adv' && nextLower && looksLikeAdjective(nextLower)) {
        detected = { category: 'adv_degree', label: 'INTENSIFIER', dmPos: 'adv', predictive: false };
      }

      // 3. After linking verb ("is", "was", "seems") when NOT followed by direct object -> participial adjectives like "interesting" stay adj_base!
      if (['is','was','are','were','am','seems','seemed','feels','felt','looks','looked','sounds','sounded','becomes','became'].includes(prevLower)) {
        if (DICT.adj_base.has(lower) || (lower.endsWith('ing') && !looksLikeDirectObjectStart(nextLower))) {
          if (detected && detected.category === 'verb_gerund' && !looksLikeDirectObjectStart(nextLower)) {
            detected = { category: 'adj_base', label: 'ADJECTIVE', dmPos: 'adj', predictive: true };
          }
        }
      }

      // 4. After possessive/determiner -> never base verb; classify as adj (if before noun) or noun!
      if (looksLikeDeterminer(prevLower)) {
        if (!detected || detected.dmPos === 'v') {
          if ((DICT.adj_base.has(lower) || looksLikeAdjective(lower)) && nextLower && !BANKS.preposition.includes(nextLower) && !BANKS.conj_coord.includes(nextLower) && !['is','are','was','were'].includes(nextLower)) {
            detected = { category: 'adj_base', label: 'ADJECTIVE', dmPos: 'adj', predictive: true };
          } else {
            detected = looksLikePluralNoun(lower)
              ? { category: 'noun_plural', label: 'PLURAL NOUN', dmPos: 'n', predictive: true }
              : { category: 'noun_singular', label: 'NOUN', dmPos: 'n', predictive: true };
          }
        }
      }

      // 5. After "to" or modal or "do/does/did" -> base verb (and after catenative "wants to" -> base verb)
      if (['to','can','could','will','would','should','must','may','might','did','do','does'].includes(prevLower)) {
        detected = { category: 'verb_base', label: 'VERB', dmPos: 'v', predictive: true };
      }

      // 6. After 3s subject pronoun -> 3rd-person singular present verb
      if (['he','she','it'].includes(prevLower) && detected && detected.category === 'verb_base') {
        detected = { category: 'verb_present3s', label: 'VERB (3RD PERSON)', dmPos: 'v', predictive: true };
      }

      // 7. Before infinitive "to" + verb ("wants to unhinge") -> catenative verb!
      if (nextLower === 'to' && detected && detected.dmPos === 'v') {
        const verbSub = detected.category === 'verb_present3s' ? 'verb_catenative_3s'
          : detected.category === 'verb_past' ? 'verb_catenative_past'
          : 'verb_catenative';
        return { category: verbSub, label: 'VERB', dmPos: 'v', predictive: false };
      }

      // 8. Transitive vs Intransitive verb refinement
      if (detected && (detected.category === 'verb_base' || detected.category === 'verb_past' || detected.category === 'verb_present3s' || detected.category === 'verb_gerund')) {
        const hasObj = looksLikeDirectObjectStart(nextLower);
        detected.transitivity = hasObj ? 'transitive' : 'intransitive';
      }

      // 9. Mass / Uncountable Noun check: singular noun with NO determiner in its NP ("Artificial intelligence") -> noun_mass!
      if (detected && detected.category === 'noun_singular') {
        const hasDetBefore = looksLikeDeterminer(prevLower) || (looksLikeAdjective(prevLower) && looksLikeDeterminer(prev2Lower));
        const afterPrepNoDet = ['at','in','on','by','with','without','for','from','to'].includes(prevLower) && !DICT.noun_mass.has(lower);
        if (DICT.noun_mass.has(lower) || (!hasDetBefore && !afterPrepNoDet)) {
          detected = { category: 'noun_mass', label: 'CONCEPT / MASS NOUN', dmPos: 'n', predictive: true };
        }
      }

      if (detected) return detected;

      // Fallback suffix rules
      if (DICT.adv.has(lower) || (lower.endsWith('ly') && lower.length > 4)) return { category: 'adv', label: 'ADVERB', dmPos: 'adv', predictive: true };
      if (DICT.adj_comparative.has(lower)) return { category: 'adj_comparative', label: 'COMPARATIVE ADJ', dmPos: 'adj', predictive: true };
      if (DICT.adj_superlative.has(lower)) return { category: 'adj_superlative', label: 'SUPERLATIVE ADJ', dmPos: 'adj', predictive: true };
      if (DICT.adj_base.has(lower) || /(ous|ful|less|able|ible|ish|ive)$/i.test(lower)) return { category: 'adj_base', label: 'ADJECTIVE', dmPos: 'adj', predictive: true };
      if (DICT.verb_gerund.has(lower) || lower.endsWith('ing')) return { category: 'verb_gerund', label: 'VERB (-ING)', dmPos: 'v', predictive: true, transitivity: looksLikeDirectObjectStart(nextLower) ? 'transitive' : 'intransitive' };
      if (DICT.verb_past.has(lower) || (lower.endsWith('ed') && lower.length > 3)) return { category: 'verb_past', label: 'PAST TENSE VERB', dmPos: 'v', predictive: true, transitivity: looksLikeDirectObjectStart(nextLower) ? 'transitive' : 'intransitive' };
      if (DICT.verb_base.has(lower)) return { category: 'verb_base', label: 'VERB', dmPos: 'v', predictive: true, transitivity: looksLikeDirectObjectStart(nextLower) ? 'transitive' : 'intransitive' };
      if (DICT.noun_plural.has(lower) || (lower.endsWith('s') && !lower.endsWith('ss') && lower.length > 3)) return { category: 'noun_plural', label: 'PLURAL NOUN', dmPos: 'n', predictive: true };
      if (DICT.noun_mass.has(lower)) return { category: 'noun_mass', label: 'CONCEPT / MASS NOUN', dmPos: 'n', predictive: true };

      return { category: 'noun_singular', label: 'NOUN', dmPos: 'n', predictive: true };
    }

    /* =========================================================================
       4. PREDICTIVE ENGINE + SLANG WEIGHTING + 7-TIER RARITY DECK BUILDER
       ========================================================================= */
    const datamuseCache = new Map();

    async function fetchPredictiveNextWords(prevWord, nextWord, dmPos, category, excludeLower) {
      if (!dmPos || !prevWord) return { common: [], uncommon: [], rare: [] };
      const cacheKey = `${prevWord.toLowerCase()}|${(nextWord || '').toLowerCase()}|${dmPos}|${category}`;
      if (datamuseCache.has(cacheKey)) {
        const cached = datamuseCache.get(cacheKey);
        return {
          common: cached.common.filter(w => w !== excludeLower),
          uncommon: cached.uncommon.filter(w => w !== excludeLower),
          rare: cached.rare.filter(w => w !== excludeLower)
        };
      }

      const params = new URLSearchParams({ lc: prevWord.toLowerCase(), md: 'pf', max: '120' });
      if (nextWord) {
        params.set('rc', nextWord.toLowerCase());
        if (dmPos === 'adj') params.set('rel_jjb', nextWord.toLowerCase());
      }

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 450);
      try {
        const res = await fetch(`https://api.datamuse.com/words?${params.toString()}`, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) return { common: [], uncommon: [], rare: [] };
        const data = await res.json();

        const buckets = { common: [], uncommon: [], rare: [] };
        const prevLower = prevWord.toLowerCase();

        for (const item of data) {
          let w = (item.word || '').toLowerCase();
          if (!w || !/^[a-z]+$/.test(w) || w.length < 3) continue;
          if (FUNCTION_WORD_BLOCKLIST.has(w)) continue;

          const tags = item.tags || [];
          if (tags.includes('prop')) continue;
          if (!tags.includes(dmPos)) continue;

          const fTag = tags.find(t => t.startsWith('f:'));
          const freq = fTag ? parseFloat(fTag.slice(2)) : 3;
          if (freq < 1.2) continue;

          // Respect article a/an harmony
          if (prevLower === 'a' && startsWithVowelSound(w)) continue;
          if (prevLower === 'an' && !startsWithVowelSound(w)) continue;

          // Keep morphological & grammatical subtype strict!
          if (category === 'adv' && !w.endsWith('ly')) continue;
          if (category === 'noun_mass' && !DICT.noun_mass.has(w)) continue;
          if (category === 'noun_singular' && w.endsWith('s') && !/(ss|us|is)$/.test(w) && hasNLP && window.nlp(w).has('#Plural')) continue;

          if (category === 'noun_plural') w = inflectPlural(w);
          else if (category === 'verb_past') w = inflectVerb(w, 'past');
          else if (category === 'verb_gerund') w = inflectVerb(w, 'gerund');
          else if (category === 'verb_present3s') w = inflectVerb(w, 'present3s');

          if (freq >= 22) buckets.common.push(w);
          else if (freq >= 5) buckets.uncommon.push(w);
          else buckets.rare.push(w);
        }

        buckets.common = [...new Set(buckets.common)];
        buckets.uncommon = [...new Set(buckets.uncommon)].filter(w => !buckets.common.includes(w));
        buckets.rare = [...new Set(buckets.rare)].filter(w => !buckets.common.includes(w) && !buckets.uncommon.includes(w));

        if (datamuseCache.size >= 250) {
          datamuseCache.delete(datamuseCache.keys().next().value);
        }
        datamuseCache.set(cacheKey, buckets);
        return {
          common: buckets.common.filter(w => w !== excludeLower),
          uncommon: buckets.uncommon.filter(w => w !== excludeLower),
          rare: buckets.rare.filter(w => w !== excludeLower)
        };
      } catch {
        clearTimeout(timer);
        return { common: [], uncommon: [], rare: [] };
      }
    }

    function generateNumberCandidates(orig) {
      const results = new Set();
      const isNeg = orig.startsWith('-');
      const isOrdinal = /(st|nd|rd|th)$/i.test(orig);
      const isDecimal = orig.includes('.');
      const formatOrdinal = (n) => {
        const mod100 = n % 100;
        if (mod100 >= 11 && mod100 <= 13) return n + 'th';
        const m = n % 10;
        return n + (m === 1 ? 'st' : m === 2 ? 'nd' : m === 3 ? 'rd' : 'th');
      };

      while (results.size < 36) {
        const sign = (isNeg && Math.random() < 0.75) ? '-' : (!isNeg && Math.random() < 0.08 ? '-' : '');
        if (isOrdinal) {
          const n = Math.floor(Math.random() * 500) + 1;
          const c = formatOrdinal(n);
          if (c.toLowerCase() !== orig.toLowerCase()) results.add(c);
        } else if (isDecimal) {
          const whole = Math.floor(Math.random() * 400);
          const decDigits = 1 + Math.floor(Math.random() * 3);
          const frac = String(Math.floor(Math.random() * Math.pow(10, decDigits))).padStart(decDigits, '0');
          const c = `${sign}${whole}.${frac}`;
          if (c !== orig) results.add(c);
        } else {
          const digits = [1, 2, 2, 3, 3, 4, 5][Math.floor(Math.random() * 7)];
          const min = digits === 1 ? 0 : Math.pow(10, digits - 1);
          const max = Math.pow(10, digits) - 1;
          const c = `${sign}${min + Math.floor(Math.random() * (max - min + 1))}`;
          if (c !== orig) results.add(c);
        }
      }
      return [...results];
    }

    function generatePunctuationCandidates(orig) {
      const sentenceMarks = ['.', '!', '?', ',', ';', ':', '...', '!?', '—', '-', '?!'];
      const quoteMarks = ['"', "'", '(', ')', '[', ']', '/', '\\'];
      const pool = quoteMarks.includes(orig) ? [...quoteMarks, ...sentenceMarks.slice(0, 5)] : sentenceMarks;
      return pool.filter(p => p !== orig);
    }

    function generateSymbolCandidates(orig) {
      const currency = ['$', '€', '£', '¥', '₹', '₩', '₿', '₱', '฿', '₪', '¢'];
      const mathSym = ['+', '-', '*', '/', '=', '%', '&', '@', '#', '^', '~', '<', '>', '|', '±', '×', '÷', '≈'];
      if (currency.includes(orig)) return { label: 'CURRENCY', items: currency.filter(s => s !== orig) };
      return { label: 'SYMBOL', items: mathSym.filter(s => s !== orig) };
    }

    function sampleArray(arr, count) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, count);
    }

    function getLocalCategoryPool(cls, excludeLower, prevLower) {
      if (cls.customPool) {
        return cls.customPool.filter(w => w.toLowerCase() !== excludeLower);
      }

      let rawPool = [];
      if (cls.category === 'verb_catenative') {
        rawPool = [...BANKS.verb_catenative];
      } else if (cls.category === 'verb_catenative_3s') {
        rawPool = BANKS.verb_catenative.map(v => inflectVerb(v, 'present3s'));
      } else if (cls.category === 'verb_catenative_past') {
        rawPool = BANKS.verb_catenative.map(v => inflectVerb(v, 'past'));
      } else if (cls.category === 'verb_base' && cls.transitivity) {
        const subset = cls.transitivity === 'intransitive' ? BANKS.verb_intransitive : BANKS.verb_transitive;
        rawPool = [...subset];
      } else if ((cls.category === 'verb_past' || cls.category === 'verb_gerund' || cls.category === 'verb_present3s') && cls.transitivity) {
        const subset = cls.transitivity === 'intransitive' ? BANKS.verb_intransitive : BANKS.verb_transitive;
        const form = cls.category === 'verb_past' ? 'past' : cls.category === 'verb_gerund' ? 'gerund' : 'present3s';
        rawPool = [...new Set([...subset.map(v => inflectVerb(v, form)), ...(DICT[cls.category] || [])])];
      } else {
        rawPool = [...(DICT[cls.category] || DICT.noun_singular)];
      }

      let filtered = rawPool.filter(w => w.toLowerCase() !== excludeLower);

      // Enforce a / an article agreement on local pools too!
      if (prevLower === 'a') {
        const cons = filtered.filter(w => !startsWithVowelSound(w));
        if (cons.length > 0) filtered = cons;
      } else if (prevLower === 'an') {
        const vows = filtered.filter(w => startsWithVowelSound(w));
        if (vows.length > 0) filtered = vows;
      }

      return filtered;
    }

    function isSlangWordForCategory(word, category) {
      const l = word.toLowerCase();
      return (SLANG_SETS[category] && SLANG_SETS[category].has(l)) ||
        (category.startsWith('verb_') && SLANG_SETS.verb_base.has(l)) ||
        SLANG_SETS.noun_singular.has(l) ||
        SLANG_SETS.noun_mass.has(l) ||
        SLANG_SETS.adj_base.has(l) ||
        SLANG_SETS.adv_degree.has(l) ||
        SLANG_SETS.adv.has(l) ||
        SLANG_SETS.interjection.has(l);
    }

    // Build weighted option deck & 80-slot visual strip with 7-tier rarities
    async function buildWordRouletteDeck(token, fullText) {
      const orig = token.text;
      let label = '';
      let sourceLabel = 'PREDICTIVE';
      let keepChance = 0.30;
      let wordCategory = 'other';

      let commonPool = [];
      let uncommonPool = [];
      let rarePool = [];
      let wildPool = [];

      if (token.type === 'number') {
        label = orig.includes('.') ? 'DECIMAL' : /(st|nd|rd|th)$/i.test(orig) ? 'ORDINAL' : 'NUMBER';
        sourceLabel = 'NUMERIC';
        keepChance = 0.28 + Math.random() * 0.06;
        const nums = generateNumberCandidates(orig);
        commonPool = nums.slice(0, 4);
        uncommonPool = nums.slice(4, 10);
        rarePool = nums.slice(10, 18);
        wildPool = nums.slice(18);
      } else if (token.type === 'punctuation') {
        label = 'PUNCTUATION';
        sourceLabel = 'SYNTAX';
        keepChance = 0.29;
        const marks = generatePunctuationCandidates(orig);
        commonPool = marks.slice(0, 3);
        uncommonPool = marks.slice(3, 6);
        rarePool = marks.slice(6, 8);
        wildPool = marks.slice(8);
      } else if (token.type === 'symbol') {
        const res = generateSymbolCandidates(orig);
        label = res.label;
        sourceLabel = 'SYMBOLS';
        keepChance = 0.28;
        commonPool = res.items.slice(0, 3);
        uncommonPool = res.items.slice(3, 6);
        rarePool = res.items.slice(6, 9);
        wildPool = res.items.slice(9);
      } else {
        const cls = classifyWord(token, fullText);
        label = cls.label;
        wordCategory = cls.category;
        const lower = orig.toLowerCase();
        const prevLower = (token.prevWord || '').toLowerCase();
        keepChance = Math.max(0.25, Math.min(0.35, 0.35 - Math.min(0.10, orig.length * 0.008)));

        if (cls.predictive && token.prevWord) {
          const pred = await fetchPredictiveNextWords(token.prevWord, token.nextWord, cls.dmPos, cls.category, lower);
          commonPool = pred.common.map(w => matchCase(orig, w));
          uncommonPool = pred.uncommon.map(w => matchCase(orig, w));
          rarePool = pred.rare.map(w => matchCase(orig, w));
          sourceLabel = (commonPool.length + uncommonPool.length > 0) ? 'PREDICTIVE + SLANG' : 'COHERENCE + SLANG';
        } else {
          sourceLabel = cls.predictive ? 'COHERENCE + SLANG' : 'SYNTAX / ENTITY';
        }

        let localArr = getLocalCategoryPool(cls, lower, prevLower);

        if (cls.category === 'adj_comparative' && localArr.length < 25) {
          const ex = sampleArray([...DICT.adj_base], 20).filter(w => /^[a-z]{3,7}$/.test(w))
            .map(w => w.endsWith('e') ? w + 'r' : w.endsWith('y') ? w.slice(0,-1)+'ier' : w + 'er');
          localArr = [...new Set([...localArr, ...ex])];
        } else if (cls.category === 'adj_superlative' && localArr.length < 25) {
          const ex = sampleArray([...DICT.adj_base], 20).filter(w => /^[a-z]{3,7}$/.test(w))
            .map(w => w.endsWith('e') ? w + 'st' : w.endsWith('y') ? w.slice(0,-1)+'iest' : w + 'est');
          localArr = [...new Set([...localArr, ...ex])];
        }

        // Split local pool into slang vs standard so applicable slang gets a slight boost (~35-40% of sampled slots)
        const localSlang = localArr.filter(w => isSlangWordForCategory(w, cls.category));
        const localStd = localArr.filter(w => !isSlangWordForCategory(w, cls.category));

        const pickedSlang = sampleArray(localSlang, 18);
        const pickedStd = sampleArray(localStd, 32);
        const blendedLocal = [];
        const maxL = Math.max(pickedSlang.length, pickedStd.length);
        for (let i = 0; i < maxL; i++) {
          if (i < pickedSlang.length) blendedLocal.push(pickedSlang[i]);
          if (i < pickedStd.length) blendedLocal.push(pickedStd[i]);
          if (i + maxL < pickedStd.length) blendedLocal.push(pickedStd[i + maxL]);
        }

        const casedLocal = blendedLocal.map(w => matchCase(orig, w))
          .filter(w => w !== orig && !commonPool.includes(w) && !uncommonPool.includes(w) && !rarePool.includes(w));

        if (commonPool.length === 0) commonPool = casedLocal.slice(0, 5);
        else if (pickedSlang.length > 0) {
          // Inject 1-2 applicable slang words into commonPool too so they mingle naturally with top predictions
          const topSlang = pickedSlang.slice(0, 2).map(w => matchCase(orig, w)).filter(w => w !== orig && !commonPool.includes(w));
          commonPool = [...topSlang, ...commonPool];
        }
        if (uncommonPool.length === 0) uncommonPool = casedLocal.slice(5, 13);
        if (rarePool.length === 0) rarePool = casedLocal.slice(13, 22);
        wildPool = casedLocal.slice(22);
        if (wildPool.length === 0) wildPool = casedLocal.slice(0, 12);
      }

      const options = [];
      options.push({ text: orig, tier: 'original', pct: keepChance * 100 });

      const remainingPct = (1 - keepChance) * 100;
      const tierBudget = {
        common: remainingPct * 0.36,
        uncommon: remainingPct * 0.28,
        rare: remainingPct * 0.20,
        epic: remainingPct * 0.11,
        legendary: remainingPct * 0.04,
        mythic: remainingPct * 0.01
      };

      const addTierItems = (pool, count, tier, totalBudget) => {
        const picked = sampleArray(pool, count);
        if (picked.length === 0) return false;
        // Weight applicable slang words ~1.4x slightly higher than regular words within the same tier
        const weights = picked.map(w => (token.type === 'word' && isSlangWordForCategory(w, wordCategory)) ? 1.42 : 1.0);
        const wSum = weights.reduce((a, b) => a + b, 0);
        for (let i = 0; i < picked.length; i++) {
          options.push({ text: picked[i], tier, pct: (weights[i] / wSum) * totalBudget });
        }
        return true;
      };

      const allFallback = [...new Set([...commonPool, ...uncommonPool, ...rarePool, ...wildPool])].filter(w => w !== orig);
      const safePool = allFallback.length > 0 ? allFallback : [orig];

      addTierItems(commonPool.length ? commonPool : safePool, Math.min(5, (commonPool.length || safePool.length)), 'common', tierBudget.common);
      addTierItems(uncommonPool.length ? uncommonPool : safePool, Math.min(7, (uncommonPool.length || safePool.length)), 'uncommon', tierBudget.uncommon);
      addTierItems(rarePool.length ? rarePool : safePool, Math.min(9, (rarePool.length || safePool.length)), 'rare', tierBudget.rare);
      addTierItems(wildPool.length ? wildPool : safePool, Math.min(9, (wildPool.length || safePool.length)), 'epic', tierBudget.epic);

      const legSource = wildPool.length >= 6 ? wildPool : safePool;
      const legPicked = sampleArray(legSource, Math.min(5, legSource.length));
      const legPer = tierBudget.legendary / Math.max(1, legPicked.length);
      for (const w of legPicked) options.push({ text: w, tier: 'legendary', pct: Math.min(0.75, legPer) });

      const mythSource = legSource.filter(w => !legPicked.includes(w));
      const mythPick = (mythSource.length ? mythSource : safePool)[Math.floor(Math.random() * (mythSource.length || safePool.length))];
      options.push({ text: mythPick, tier: 'mythic', pct: Math.max(0.15, Math.min(0.28, tierBudget.mythic)) });

      // Normalize exact probabilities to sum to 100%
      const sumPct = options.reduce((acc, o) => acc + o.pct, 0);
      for (const o of options) o.pct = (o.pct / sumPct) * 100;

      // Draw unbiased winner according to exact probabilities
      let r = Math.random() * 100;
      let winner = options[0];
      for (const o of options) {
        r -= o.pct;
        if (r <= 0) { winner = o; break; }
      }

      // Build 80-slot visual strip
      const STRIP_LEN = 80;
      const WIN_INDEX = 62;
      const deck = new Array(STRIP_LEN);
      deck[WIN_INDEX] = winner;

      const origSlots = Math.round((options[0].pct / 100) * (STRIP_LEN - 1));
      const nonOrigSlots = [];
      for (let i = 0; i < STRIP_LEN; i++) {
        if (i !== WIN_INDEX) nonOrigSlots.push(i);
      }

      const origStep = nonOrigSlots.length / Math.max(1, origSlots);
      const origIdxSet = new Set();
      for (let k = 0; k < origSlots; k++) {
        let p = Math.floor(k * origStep + Math.random() * Math.max(1, origStep * 0.65));
        p = Math.min(nonOrigSlots.length - 1, p);
        while (origIdxSet.has(nonOrigSlots[p])) p = (p + 1) % nonOrigSlots.length;
        origIdxSet.add(nonOrigSlots[p]);
      }

      const altOptions = options.slice(1);
      const altTotal = altOptions.reduce((a, o) => a + o.pct, 0);
      const pickWeightedAlt = () => {
        if (altOptions.length === 0) return options[0];
        let x = Math.random() * altTotal;
        for (const o of altOptions) {
          x -= o.pct;
          if (x <= 0) return o;
        }
        return altOptions[0];
      };

      const teaserPositions = [WIN_INDEX - 3, WIN_INDEX + 2, WIN_INDEX - 11].filter(idx => idx >= 0 && idx < STRIP_LEN && idx !== WIN_INDEX && !origIdxSet.has(idx));
      const legOpt = altOptions.find(o => o.tier === 'legendary');
      const mythOpt = altOptions.find(o => o.tier === 'mythic');

      for (const idx of nonOrigSlots) {
        if (origIdxSet.has(idx)) {
          deck[idx] = options[0];
        } else if (idx === teaserPositions[0] && mythOpt && winner.tier !== 'mythic') {
          deck[idx] = mythOpt;
        } else if (idx === teaserPositions[1] && legOpt) {
          deck[idx] = legOpt;
        } else {
          deck[idx] = pickWeightedAlt();
        }
      }

      return {
        mode: 'word',
        deck,
        winIndex: WIN_INDEX,
        winner,
        kept: winner.text === orig,
        label,
        sourceLabel,
        keepPercent: Math.round(options[0].pct)
      };
    }

    /* =========================================================================
       5. DELETE ROULETTE (SUPPORTS BOTH SINGLE KEYSTROKE & DRAG-SELECTION!)
       ========================================================================= */
    function analyzeDeleteOperation(text, selStart, selEnd, isForwardDelete) {
      const hasSelection = selEnd > selStart;

      if (hasSelection) {
        // 1. Collect non-space chars inside the user's highlighted selection
        const selectedIndices = [];
        if (!isForwardDelete) {
          for (let i = selEnd - 1; i >= selStart; i--) {
            if (!/\s/.test(text[i])) selectedIndices.push(i);
          }
        } else {
          for (let i = selStart; i < selEnd; i++) {
            if (!/\s/.test(text[i])) selectedIndices.push(i);
          }
        }
        if (selectedIndices.length === 0) return null; // Pure whitespace selection -> normal delete

        // 2. Collect up to 3 adjacent overflow words beyond the selection for Legendary/Mythic overshoot
        const collectOverflow = (dirForward) => {
          const out = [];
          let chunks = 0;
          let inChunk = false;
          if (!dirForward) {
            for (let i = selStart - 1; i >= 0; i--) {
              if (!/\s/.test(text[i])) {
                out.push(i);
                inChunk = true;
              } else if (inChunk) {
                chunks++;
                inChunk = false;
                if (chunks >= 3) break;
              }
            }
          } else {
            for (let i = selEnd; i < text.length; i++) {
              if (!/\s/.test(text[i])) {
                out.push(i);
                inChunk = true;
              } else if (inChunk) {
                chunks++;
                inChunk = false;
                if (chunks >= 3) break;
              }
            }
          }
          return out;
        };

        let overflow = collectOverflow(isForwardDelete);
        if (overflow.length === 0) overflow = collectOverflow(!isForwardDelete);

        const combined = [...selectedIndices, ...overflow];
        const previewRaw = text.slice(selStart, selEnd).trim();
        const targetLabel = previewRaw.length > 26 ? previewRaw.slice(0, 24) + '…' : previewRaw;

        return {
          isSelection: true,
          selectedCount: selectedIndices.length,
          nonSpaceIndices: combined,
          currentWordLen: selectedIndices.length,
          maxDeletable: combined.length,
          targetLabel,
          isForwardDelete
        };
      }

      // Single-caret Backspace / Delete
      const caret = selStart;
      if (!isForwardDelete && (caret === 0 || /\s/.test(text[caret - 1]))) return null;
      if (isForwardDelete && (caret >= text.length || /\s/.test(text[caret]))) return null;
      const nonSpaceIndices = [];
      if (!isForwardDelete) {
        for (let i = caret - 1; i >= 0; i--) {
          if (!/\s/.test(text[i])) nonSpaceIndices.push(i);
        }
      } else {
        for (let i = caret; i < text.length; i++) {
          if (!/\s/.test(text[i])) nonSpaceIndices.push(i);
        }
      }
      if (nonSpaceIndices.length === 0) return null;

      const chunks = [];
      let cur = [nonSpaceIndices[0]];
      for (let k = 1; k < nonSpaceIndices.length; k++) {
        const idx = nonSpaceIndices[k];
        const prevIdx = nonSpaceIndices[k - 1];
        if (Math.abs(idx - prevIdx) === 1) {
          cur.push(idx);
        } else {
          chunks.push(cur);
          cur = [idx];
          if (chunks.length >= 4) break;
        }
      }
      if (chunks.length < 4 && cur.length > 0) chunks.push(cur);

      const firstCharIdx = nonSpaceIndices[0];
      let wStart = firstCharIdx, wEnd = firstCharIdx + 1;
      while (wStart > 0 && !/\s/.test(text[wStart - 1])) wStart--;
      while (wEnd < text.length && !/\s/.test(text[wEnd])) wEnd++;
      const fullWordText = text.slice(wStart, wEnd);

      const currentWordLen = fullWordText.length;
      const availableInDir = chunks.reduce((sum, c) => sum + c.length, 0);

      return {
        isSelection: false,
        selectedCount: 1,
        nonSpaceIndices: nonSpaceIndices.slice(0, availableInDir),
        currentWordLen,
        maxDeletable: availableInDir,
        targetLabel: fullWordText,
        isForwardDelete
      };
    }

    function buildDeleteRouletteDeck(delInfo) {
      const { isSelection, selectedCount, currentWordLen, maxDeletable, targetLabel } = delInfo;
      const options = [];

      const baselineCount = isSelection ? selectedCount : 1;
      const hasLegendaries = maxDeletable > currentWordLen;

      // Exact intended wipe (-1 char on keystroke, or -S chars on selection): ~32% Common
      options.push({
        count: baselineCount,
        text: `-${baselineCount} char${baselineCount === 1 ? '' : 's'}`,
        tier: 'common',
        pct: 32
      });

      // Other counts within current word / selection (partial wipe or full single-word wipe)
      let midNums = [];
      for (let n = 1; n <= Math.min(currentWordLen, maxDeletable); n++) {
        if (n !== baselineCount) midNums.push(n);
      }
      if (midNums.length > 12) {
        midNums = [...new Set([1, ...sampleArray(midNums.slice(1, -1), 10), midNums[midNums.length - 1]])].sort((a, b) => a - b);
      }

      const midBudget = hasLegendaries ? 59 : 68;

      if (midNums.length > 0) {
        if (isSelection) {
          // Partial selection wipes: surviving chars morph via edit distance!
          const per = midBudget / midNums.length;
          for (const n of midNums) {
            options.push({
              count: n,
              text: `-${n} char${n === 1 ? '' : 's'}`,
              tier: per >= 6 ? 'common' : 'uncommon',
              pct: per
            });
          }
        } else {
          const wordKillPct = Math.min(14, Math.max(7, midBudget * 0.25));
          const otherMid = midNums.filter(n => n !== currentWordLen);
          const otherPct = otherMid.length > 0 ? (midBudget - wordKillPct) / otherMid.length : 0;

          for (const n of midNums) {
            const isFullWord = n === currentWordLen;
            const pct = isFullWord ? (otherMid.length > 0 ? wordKillPct : midBudget) : otherPct;
            const tier = isFullWord ? 'uncommon' : (pct >= 5 ? 'common' : 'uncommon');
            options.push({
              count: n,
              text: `-${n} char${n === 1 ? '' : 's'}`,
              tier,
              pct
            });
          }
        }
      }

      // Overshoot past word / selection into neighboring words -> LEGENDARY & MYTHIC!
      if (hasLegendaries) {
        const legNums = [];
        for (let n = currentWordLen + 1; n <= maxDeletable; n++) legNums.push(n);
        const legBudget = 9;
        const chosenLeg = legNums.length <= 14
          ? legNums
          : [...new Set([legNums[0], ...sampleArray(legNums.slice(1, -1), 11), legNums[legNums.length - 1]])].sort((a, b) => a - b);

        for (let i = 0; i < chosenLeg.length; i++) {
          const n = chosenLeg[i];
          const isMaxWipe = n === maxDeletable && legNums.length >= 3;
          const pct = isMaxWipe
            ? 0.22
            : Math.min(0.75, (legBudget - (legNums.length >= 3 ? 0.22 : 0)) / Math.max(1, chosenLeg.length - (legNums.length >= 3 ? 1 : 0)));
          options.push({
            count: n,
            text: `-${n} chars`,
            tier: isMaxWipe ? 'mythic' : 'legendary',
            pct
          });
        }
      }

      const sum = options.reduce((a, o) => a + o.pct, 0);
      for (const o of options) o.pct = (o.pct / sum) * 100;

      let r = Math.random() * 100;
      let winner = options[0];
      for (const o of options) {
        r -= o.pct;
        if (r <= 0) { winner = o; break; }
      }

      const STRIP_LEN = 80;
      const WIN_INDEX = 62;
      const deck = new Array(STRIP_LEN);
      deck[WIN_INDEX] = winner;

      const pickWeighted = () => {
        let x = Math.random() * 100;
        for (const o of options) {
          x -= o.pct;
          if (x <= 0) return o;
        }
        return options[0];
      };

      const legOption = options.find(o => o.tier === 'legendary');
      const mythOption = options.find(o => o.tier === 'mythic');

      for (let i = 0; i < STRIP_LEN; i++) {
        if (i === WIN_INDEX) continue;
        if (i === WIN_INDEX - 2 && legOption) deck[i] = legOption;
        else if (i === WIN_INDEX + 2 && mythOption) deck[i] = mythOption;
        else deck[i] = pickWeighted();
      }

      return {
        mode: 'delete',
        deck,
        winIndex: WIN_INDEX,
        winner,
        label: isSelection ? 'SELECTION DELETE' : 'DELETE ROULETTE',
        sourceLabel: `${maxDeletable} CHAR RANGE`,
        keepPercent: Math.round(options[0].pct),
        targetPreview: targetLabel
      };
    }

    function applyDeleteCountAndMorphWords(text, info, deleteCount, caret) {
      if (!info) return null;

      const toDelete = info.nonSpaceIndices.slice(0, deleteCount);
      const delSet = new Set(toDelete);

      const minDelIdx = Math.min(...toDelete);
      const maxDelIdx = Math.max(...toDelete);

      let spanStart = minDelIdx;
      while (spanStart > 0 && !/\s/.test(text[spanStart - 1])) spanStart--;

      let spanEnd = maxDelIdx + 1;
      while (spanEnd < text.length && !/\s/.test(text[spanEnd])) spanEnd++;

      if (!info.isSelection) {
        if (!info.isForwardDelete && caret > spanEnd && /^\s+$/.test(text.slice(spanEnd, caret))) {
          spanEnd = caret;
        } else if (info.isForwardDelete && caret < spanStart && /^\s+$/.test(text.slice(caret, spanStart))) {
          spanStart = caret;
        }
      }

      const rebuiltTokens = [];
      let i = spanStart;
      while (i < spanEnd) {
        if (/\s/.test(text[i])) {
          const wsStart = i;
          while (i < spanEnd && /\s/.test(text[i])) i++;
          rebuiltTokens.push({ type: 'ws', val: text.slice(wsStart, i) });
        } else {
          const tStart = i;
          while (i < spanEnd && !/\s/.test(text[i])) i++;
          const origTok = text.slice(tStart, i);
          let surviving = '';
          let hadDeletion = false;
          for (let k = tStart; k < i; k++) {
            if (delSet.has(k)) hadDeletion = true;
            else surviving += text[k];
          }
          if (surviving.length > 0) {
            let finalTok = surviving;
            if (hadDeletion && /^[a-zA-Z]+$/.test(surviving)) {
              finalTok = findClosestSameLengthWord(surviving, origTok);
            }
            rebuiltTokens.push({ type: 'tok', val: finalTok });
          }
        }
      }

      const cleanedParts = [];
      for (const item of rebuiltTokens) {
        if (item.type === 'tok') {
          if (cleanedParts.length > 0 && cleanedParts[cleanedParts.length - 1].type === 'tok') {
            cleanedParts.push({ type: 'ws', val: ' ' });
          }
          cleanedParts.push(item);
        } else {
          if (cleanedParts.length > 0 && cleanedParts[cleanedParts.length - 1].type === 'tok') {
            cleanedParts.push(item);
          }
        }
      }
      while (cleanedParts.length > 0 && cleanedParts[cleanedParts.length - 1].type === 'ws') {
        cleanedParts.pop();
      }

      let finalBeforeEnd = spanStart;
      let finalAfterStart = spanEnd;
      const newSpanText = cleanedParts.map(p => p.val).join('');

      if (newSpanText.length === 0) {
        if (finalBeforeEnd > 0 && text[finalBeforeEnd - 1] === ' ') {
          finalBeforeEnd--;
        } else if (finalAfterStart < text.length && text[finalAfterStart] === ' ') {
          finalAfterStart++;
        }
      }

      return {
        spanStart: finalBeforeEnd,
        spanEnd: finalAfterStart,
        oldSpanText: text.slice(finalBeforeEnd, finalAfterStart),
        newSpanText
      };
    }

    function playTickSound(speedRatio = 0.5) {
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(580 + speedRatio * 340, now);
      osc.frequency.exponentialRampToValueAtTime(210, now + 0.024);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.028);
    }

        const t = now + i * 0.055;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.linearRampToValueAtTime(0.095, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);

    function spawnOutwardConfetti(cx, cy, tier, isDelete) {

    function spawnEditorWordConfetti(rect, colorTheme) {
