    function startConfettiLoop() {
      syncConfettiCanvasSize();
      if (confettiRaf) return;

      const step = () => {
        // Clear full pixel buffer with identity transform so zero ghost pixels remain
        cCtx.setTransform(1, 0, 0, 1, 0, 0);
        cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        cCtx.setTransform(confettiDpr, 0, 0, confettiDpr, 0, 0);

        for (let i = confettiParticles.length - 1; i >= 0; i--) {
          const p = confettiParticles[i];
          p.vx *= p.drag;
          p.vy = p.vy * p.drag + p.gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.scale = Math.min(p.maxScale, p.scale + p.zSpeed);
          p.rot += p.vRot;
          p.tilt += p.vTilt;
          p.alpha -= p.decay;

          // Cull faded OR off-screen particles via swap-and-pop
          if (
            p.alpha <= 0.01 ||
            p.y > confettiViewH + 60 ||
            p.x < -60 ||
            p.x > confettiViewW + 60
          ) {
            confettiParticles[i] = confettiParticles[confettiParticles.length - 1];
            confettiParticles.pop();
            continue;
          }

          cCtx.save();
          cCtx.globalAlpha = p.alpha;
          cCtx.translate(p.x, p.y);
          cCtx.rotate(p.rot);
          cCtx.scale(p.scale, p.scale * Math.cos(p.tilt));
          cCtx.fillStyle = p.color;
          cCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          cCtx.restore();
        }

        if (confettiParticles.length > 0) {
          confettiRaf = requestAnimationFrame(step);
        } else {
          releaseConfettiCanvas();
        }
      };

      confettiRaf = requestAnimationFrame(step);
    }

    /* =========================================================================
       8. TOKENIZER & EDITOR STATE
       ========================================================================= */
    const CURRENCY_CHARS = '$€£¥₹₩₿₱฿₪¢';

    function tokenizeText(text) {
      const tokens = [];
      let i = 0;
      const n = text.length;
      const isWordChar = (ch) => /[a-zA-Z]/.test(ch);
      const isDigit = (ch) => /[0-9]/.test(ch);
      const isSpace = (ch) => /\s/.test(ch);
      const isCurrency = (ch) => CURRENCY_CHARS.includes(ch);

      while (i < n) {
        const ch = text[i];
        if (isSpace(ch)) { i++; continue; }

        if (isDigit(ch) || (ch === '-' && i + 1 < n && isDigit(text[i + 1]) && (i === 0 || isSpace(text[i - 1]) || isCurrency(text[i - 1]) || /[([=]/.test(text[i - 1])))) {
          const start = i;
          if (ch === '-') i++;
          while (i < n && isDigit(text[i])) i++;
          if (i < n && text[i] === '.' && i + 1 < n && isDigit(text[i + 1])) {
            i++;
            while (i < n && isDigit(text[i])) i++;
          } else {
            const rest = text.slice(i, i + 2).toLowerCase();
            if (/^(st|nd|rd|th)$/.test(rest) && (i + 2 >= n || !isWordChar(text[i + 2]))) i += 2;
          }
          const end = i;
          const nextCh = end < n ? text[end] : '';
          const pendingTrailingDot = !text.slice(start, end).includes('.') && nextCh === '.' && end + 1 === n;
          tokens.push({
            type: 'number',
            text: text.slice(start, end),
            start,
            end,
            completed: !pendingTrailingDot && nextCh !== '' && !isDigit(nextCh) && !isWordChar(nextCh)
          });
          continue;
        }

        if (isWordChar(ch)) {
          const start = i;
          while (i < n && (isWordChar(text[i]) || (text[i] === "'" && i + 1 < n && isWordChar(text[i + 1])))) i++;
          const end = i;
          const nextCh = end < n ? text[end] : '';
          const prevCh = start > 0 ? text[start - 1] : '';
          tokens.push({
            type: 'word',
            text: text.slice(start, end),
            start,
            end,
            precededByDot: prevCh === '.',
            completed: nextCh !== '' && !isWordChar(nextCh) && nextCh !== "'"
          });
          continue;
        }

        const three = text.slice(i, i + 3);
        const two = text.slice(i, i + 2);
        if (three === '...') {
          const start = i; i += 3;
          const nextCh = i < n ? text[i] : '';
          tokens.push({ type: 'punctuation', text: '...', start, end: i, completed: nextCh !== '' && isSpace(nextCh) });
          continue;
        }
        if (two === '!?' || two === '?!') {
          const start = i; i += 2;
          const nextCh = i < n ? text[i] : '';
          tokens.push({ type: 'punctuation', text: two, start, end: i, completed: nextCh !== '' && isSpace(nextCh) });
          continue;
        }

        if (/[.,!?;:\-—'"()\[\]\/\\]/.test(ch)) {
          const start = i; i++;
          const nextCh = i < n ? text[i] : '';
          tokens.push({ type: 'punctuation', text: ch, start, end: i, completed: nextCh !== '' && isSpace(nextCh) });
          continue;
        }

        const start = i; i++;
        const nextCh = i < n ? text[i] : '';
        const isCurr = isCurrency(ch);
        tokens.push({
          type: 'symbol',
          text: ch,
          start,
          end: i,
          completed: isCurr ? (nextCh !== '' && (isSpace(nextCh) || isDigit(nextCh))) : (nextCh !== '' && isSpace(nextCh))
        });
      }

      const wordTokens = tokens.filter(t => t.type === 'word');
      for (let w = 0; w < wordTokens.length; w++) {
        wordTokens[w].prev2Word = w > 1 ? wordTokens[w - 2].text : null;
        wordTokens[w].prevWord = w > 0 ? wordTokens[w - 1].text : null;
        wordTokens[w].nextWord = w + 1 < wordTokens.length ? wordTokens[w + 1].text : null;
      }
      return tokens;
    }

    function computeEditRange(oldText, newText) {
      let prefix = 0;
      const minLen = Math.min(oldText.length, newText.length);
      while (prefix < minLen && oldText[prefix] === newText[prefix]) prefix++;

      let oldSuffix = oldText.length;
      let newSuffix = newText.length;
      while (oldSuffix > prefix && newSuffix > prefix && oldText[oldSuffix - 1] === newText[newSuffix - 1]) {
        oldSuffix--;
        newSuffix--;
      }
      return { prefix, oldSuffix, newSuffix };
    }

    function computeEditRangeWithHint(oldText, newText, hintStart) {
      let prefix = 0;
      const maxPrefix = typeof hintStart === 'number'
        ? Math.min(hintStart, oldText.length, newText.length)
        : Math.min(oldText.length, newText.length);
      while (prefix < maxPrefix && oldText[prefix] === newText[prefix]) prefix++;

      let oldSuffix = oldText.length;
      let newSuffix = newText.length;
      while (oldSuffix > prefix && newSuffix > prefix && oldText[oldSuffix - 1] === newText[newSuffix - 1]) {
        oldSuffix--;
        newSuffix--;
      }
      return { prefix, oldSuffix, newSuffix };
    }

    function adjustSettledSpans(prefix, oldSuffix, delta) {
      const updated = [];
      for (const sp of settledSpans) {
        if (sp.end <= prefix) updated.push(sp);
        else if (sp.start >= oldSuffix) updated.push({ start: sp.start + delta, end: sp.end + delta, text: sp.text });
      }
      settledSpans = updated;
    }

    function markAllCompletedAsSettled(text) {
      settledSpans = tokenizeText(text).filter(t => t.completed).map(t => ({ start: t.start, end: t.end, text: t.text }));
    }

    function shiftSpansAfterReplacement(repStart, oldEnd, delta, newWord) {
      for (const sp of settledSpans) {
        if (sp.start >= oldEnd) { sp.start += delta; sp.end += delta; }
      }
      if (newWord) settledSpans.push({ start: repStart, end: repStart + newWord.length, text: newWord });
      for (const q of rollQueue) {
        if (q.kind === 'word' && q.token.start >= oldEnd) {
          q.token.start += delta;
          q.token.end += delta;
        }
      }
    }

    textarea.addEventListener('paste', (e) => {
      if (isProcessingRoll) {
        e.preventDefault();
        return;
      }
      pendingPaste = {
        start: textarea.selectionStart,
        selEnd: textarea.selectionEnd,
        time: Date.now()
      };
    });

    textarea.addEventListener('input', () => {
      if (isProcessingRoll) return;
      const newText = textarea.value;
      const pasteMeta = (pendingPaste && Date.now() - pendingPaste.time < 1000) ? pendingPaste : null;
      pendingPaste = null;

      const isPaste = Boolean(pasteMeta);
      const isDeletionOnly = !isPaste && newText.length < lastText.length;
      const { prefix, oldSuffix, newSuffix } = computeEditRangeWithHint(lastText, newText, pasteMeta?.start);

      adjustSettledSpans(prefix, oldSuffix, newSuffix - oldSuffix);
      lastText = newText;
      renderPlainMirror(newText);

      if (isDeletionOnly) return;

      const tokens = tokenizeText(newText);
      let added = false;
      for (const tok of tokens) {
        const settled = settledSpans.some(sp => sp.start === tok.start && sp.end === tok.end && sp.text === tok.text);
        const queued = rollQueue.some(q => q.kind === 'word' && q.token.start === tok.start && q.token.end === tok.end && q.token.text === tok.text);

        // When pasting, queue every token inside the pasted span (including final word/punctuation),
        // unless it fused directly into trailing existing word characters past newSuffix.
        const fromPaste = isPaste && tok.end > prefix && tok.end <= newSuffix;
        if ((tok.completed || fromPaste) && !settled && !queued) {
          rollQueue.push({ kind: 'word', token: tok, fromPaste });
          added = true;
        }
      }
      if (added && !isProcessingRoll) processQueue();
    });

    // Intercept Backspace & Delete (both single-caret and highlighted drag/select!)
    textarea.addEventListener('keydown', (e) => {
      if (isProcessingRoll) {
        e.preventDefault();
        return;
      }
      if (e.key !== 'Backspace' && e.key !== 'Delete') return;

      const selStart = textarea.selectionStart;
      const selEnd = textarea.selectionEnd;
      const isForward = e.key === 'Delete';
      const info = analyzeDeleteOperation(textarea.value, selStart, selEnd, isForward);
      if (!info) return; // Empty or whitespace-only selection -> allow normal keydown

      e.preventDefault();
      rollQueue.push({ kind: 'delete', caret: selStart, isForward, info });
      processQueue();
    });

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function processQueue() {
      if (isProcessingRoll || rollQueue.length === 0) return;
      isProcessingRoll = true;
      skipRemainingRequested = false;
      textarea.readOnly = true;

      while (rollQueue.length > 0) {
        const job = rollQueue.shift();
        if (job.kind === 'delete') {
          await runDeleteRouletteAndMorph(job);
        } else {
          const tok = job.token;
          if (textarea.value.slice(tok.start, tok.end) !== tok.text) continue;
          if (skipRemainingRequested) {
            settledSpans.push({ start: tok.start, end: tok.end, text: tok.text });
            continue;
          }
          const liveTok = tokenizeText(textarea.value).find(t => t.start === tok.start && t.end === tok.end && t.text === tok.text) || tok;
          await runWordRouletteAndMorph(liveTok);
        }
      }

      isProcessingRoll = false;
      skipRemainingRequested = false;
      textarea.readOnly = false;
      textarea.classList.remove('anim-hide-caret');
      textarea.focus();
    }

    /* =========================================================================
       10. SCREEN SHAKE & RARITY INTRUSION HELPERS
       ========================================================================= */
    function triggerImpactShake(intensity, durationMs) {
      const start = performance.now();
      const step = (now) => {
        const t = (now - start) / durationMs;
        if (t >= 1) {
          shakeWrapper.style.transform = '';
          return;
        }
        const decay = Math.pow(1 - t, 1.8);
        const x = (Math.random() - 0.5) * 2 * intensity * decay;
        const y = (Math.random() - 0.5) * 2 * intensity * decay;
        const rot = (Math.random() - 0.5) * 0.4 * (intensity / 8) * decay;
        shakeWrapper.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) rotate(${rot.toFixed(2)}deg)`;
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function showRarityCelebration(tier, pct) {
      modal.classList.remove('rarity-glow-epic', 'rarity-glow-legendary', 'rarity-glow-mythic');
      rarityIntrusion.classList.remove('active');
      rarityPctPopup.classList.remove('visible');

      if (!['epic', 'legendary', 'mythic'].includes(tier)) return;

      modal.classList.add(`rarity-glow-${tier}`);
      rarityStampLabel.className = `rarity-stamp tier-${tier}`;

      if (tier === 'epic') {
        rarityStampLabel.textContent = 'EPIC ROLL!';
        rarityBurstBg.style.background = 'radial-gradient(circle, rgba(168,85,247,0.45), transparent 70%)';
        triggerImpactShake(7, 360);
      } else if (tier === 'legendary') {
        rarityStampLabel.textContent = '★ LEGENDARY ★';
        rarityBurstBg.style.background = 'radial-gradient(circle, rgba(251,191,36,0.5), transparent 70%)';
        rarityPctPopup.textContent = `${pct.toFixed(2)}% CHANCE`;
        rarityPctPopup.classList.add('visible');
        triggerImpactShake(13, 540);
      } else if (tier === 'mythic') {
        rarityStampLabel.textContent = '✦ MYTHIC ✦';
        rarityBurstBg.style.background = 'radial-gradient(circle, rgba(236,72,153,0.55), rgba(56,189,248,0.25), transparent 72%)';
        rarityPctPopup.textContent = `${pct.toFixed(2)}% CHANCE`;
        rarityPctPopup.classList.add('visible');
        triggerImpactShake(18, 700);
      }

      requestAnimationFrame(() => rarityIntrusion.classList.add('active'));
    }

    function resetRarityVisuals() {
      modal.classList.remove('rarity-glow-epic', 'rarity-glow-legendary', 'rarity-glow-mythic');
      rarityIntrusion.classList.remove('active');
      rarityPctPopup.classList.remove('visible');
      shakeWrapper.style.transform = '';
    }

    function populateStripDOM(deck) {
      stripEl.innerHTML = '';
      stripEl.style.transform = 'translate3d(0px, 0, 0)';
      const cardEls = [];
      for (const item of deck) {
        const card = document.createElement('div');
        card.className = `slot-card tier-${item.tier}`;

        const badge = document.createElement('span');
        badge.className = 'slot-badge';
        badge.textContent = item.tier === 'original' ? 'ORIGINAL' : item.tier.toUpperCase();

        const wordSpan = document.createElement('span');
        const lenCls = item.text.length > 13 ? 'len-long' : item.text.length > 9 ? 'len-med' : '';
        wordSpan.className = `slot-word ${lenCls}`;
        wordSpan.textContent = item.text;

        const pctSpan = document.createElement('span');
        pctSpan.className = 'slot-pct';
        pctSpan.textContent = item.pct < 1 ? `${item.pct.toFixed(2)}%` : `${item.pct.toFixed(1)}%`;

        card.appendChild(badge);
        card.appendChild(wordSpan);
        card.appendChild(pctSpan);
        stripEl.appendChild(card);
        cardEls.push(card);
      }
      return cardEls;
    }

    function animateRouletteSpin(startX, targetX, duration, pitch, centerOffset) {
      return new Promise(resolve => {
        const startTime = performance.now();
        let lastIndex = -1;

        function tick(now) {
          const elapsed = now - startTime;
          const t = Math.min(1, elapsed / duration);
          const ease = 1 - Math.pow(1 - t, 4.65);
          const currentX = startX + (targetX - startX) * ease;
          stripEl.style.transform = `translate3d(${currentX}px, 0, 0)`;

          if (!turboMode && t > 0.25 && t < 0.96) {
            const amp = t < 0.7 ? 1.5 : 2.6 * (1 - (t - 0.7) / 0.3);
            const sx = (Math.random() - 0.5) * amp;
            const sy = (Math.random() - 0.5) * amp;
            shakeWrapper.style.transform = `translate3d(${sx.toFixed(1)}px, ${sy.toFixed(1)}px, 0)`;
          } else if (t >= 0.96) {
            shakeWrapper.style.transform = '';
          }

          const centerPosInStrip = centerOffset - currentX;
          const currentIndex = Math.floor(centerPosInStrip / pitch);
          if (currentIndex !== lastIndex) {
            if (lastIndex !== -1) {
              playTickSound(1 - t);
              needleCapTop.classList.add('tick-kick');
              setTimeout(() => needleCapTop.classList.remove('tick-kick'), 55);
            }
            lastIndex = currentIndex;
          }

          if (t < 1) requestAnimationFrame(tick);
          else {
            stripEl.style.transform = `translate3d(${targetX}px, 0, 0)`;
            shakeWrapper.style.transform = '';
            resolve();
          }
        }
        requestAnimationFrame(tick);
      });
    }

    /* =========================================================================
       11. WORD ROULETTE & BLUE MORPH FLOW
       ========================================================================= */
    async function runWordRouletteAndMorph(token) {
      revealGamblingUI();
      resetRarityVisuals();
      modal.classList.remove('delete-mode');

      const deckData = await buildWordRouletteDeck(token, textarea.value);

      const posTag = document.getElementById('modal-pos-tag');
      posTag.className = 'tag-chip tag-pos';
      posTag.textContent = deckData.label;
      document.getElementById('modal-odds-tag').textContent = `KEEP ODDS: ${deckData.keepPercent}%`;
      document.getElementById('modal-source-tag').textContent = deckData.sourceLabel;
      document.getElementById('modal-typed-label').textContent = 'TYPED';
      document.getElementById('modal-typed-word').textContent = token.text;

      outcomeBanner.className = 'outcome-banner';
      outcomeBanner.textContent = 'Rolling...';

      if (rollQueue.length > 0) {
        queueControls.style.display = 'flex';
        queueCountLabel.textContent = `${rollQueue.length} more queued`;
      } else {
        queueControls.style.display = 'none';
      }

      const cardEls = populateStripDOM(deckData.deck);

      modal.classList.remove('pop-into-editor');
      modal.style.transform = '';
      document.body.classList.add('modal-active');
      backdrop.classList.add('open');

      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      const viewportWidth = viewportEl.clientWidth;
      const cardWidth = cardEls[0].offsetWidth;
      const pitch = cardWidth + 10;
      const centerOffset = viewportWidth / 2;
      const jitter = (Math.random() - 0.5) * (cardWidth * 0.56);
      const startX = -(1 * pitch + cardWidth / 2 - centerOffset);
      const targetX = -(deckData.winIndex * pitch + cardWidth / 2 + jitter - centerOffset);

      const spinDuration = turboMode ? 1550 : 3550;
      await animateRouletteSpin(startX, targetX, spinDuration, pitch, centerOffset);

      const winCard = cardEls[deckData.winIndex];
      winCard.classList.add('winner-card');

      const winItem = deckData.winner;
      if (deckData.kept) {
        statsKept++;
        outcomeBanner.className = 'outcome-banner win-kept';
        outcomeBanner.textContent = `KEPT! "${winItem.text}" survived the roll.`;
      } else {
        statsRolled++;
        outcomeBanner.className = 'outcome-banner win-rolled';
        outcomeBanner.textContent = `[${winItem.tier.toUpperCase()}] "${token.text}" → "${winItem.text}"`;
      }
      updateCounts(textarea.value);

      if (!['epic', 'legendary', 'mythic'].includes(winItem.tier)) {
        triggerImpactShake(4.5, 220);
      }
      showRarityCelebration(winItem.tier, winItem.pct);

      const winRect = winCard.getBoundingClientRect();
      spawnOutwardConfetti(winRect.left + winRect.width / 2, winRect.top + winRect.height / 2, winItem.tier, false);
      playOutcomeSound(winItem.tier, false);

      const isHighTier = ['epic', 'legendary', 'mythic'].includes(winItem.tier);
      const holdMs = turboMode
        ? (isHighTier ? 1050 : 560)
        : (winItem.tier === 'mythic' ? 2300 : winItem.tier === 'legendary' ? 2000 : winItem.tier === 'epic' ? 1650 : 1220);
      await sleep(holdMs);

      await executeEditorMorph({
        spanStart: token.start,
        spanEnd: token.end,
        oldSpanText: token.text,
        newSpanText: winItem.text,
        theme: 'blue'
      });
    }

    /* =========================================================================
       12. DELETE ROULETTE & RED MORPH FLOW
       ========================================================================= */
    async function runDeleteRouletteAndMorph(job) {
      revealGamblingUI();
      resetRarityVisuals();
      modal.classList.add('delete-mode');

      const deckData = buildDeleteRouletteDeck(job.info);

      const posTag = document.getElementById('modal-pos-tag');
      posTag.className = 'tag-chip tag-pos delete-chip';
      posTag.textContent = deckData.label;
      document.getElementById('modal-odds-tag').textContent =
        job.info.isSelection ? `EXACT ODDS: ${deckData.keepPercent}%` : `-1 ODDS: ${deckData.keepPercent}%`;
      document.getElementById('modal-source-tag').textContent = deckData.sourceLabel;
      document.getElementById('modal-typed-label').textContent = 'TARGET';
      document.getElementById('modal-typed-word').textContent = deckData.targetPreview;

      outcomeBanner.className = 'outcome-banner';
      outcomeBanner.textContent = 'Rolling deletion count...';
      queueControls.style.display = 'none';

      const cardEls = populateStripDOM(deckData.deck);

      modal.classList.remove('pop-into-editor');
      modal.style.transform = '';
      document.body.classList.add('modal-active');
      backdrop.classList.add('open');

      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      const viewportWidth = viewportEl.clientWidth;
      const cardWidth = cardEls[0].offsetWidth;
      const pitch = cardWidth + 10;
      const centerOffset = viewportWidth / 2;
      const jitter = (Math.random() - 0.5) * (cardWidth * 0.54);
      const startX = -(1 * pitch + cardWidth / 2 - centerOffset);
      const targetX = -(deckData.winIndex * pitch + cardWidth / 2 + jitter - centerOffset);

      const spinDuration = turboMode ? 1550 : 3400;
      await animateRouletteSpin(startX, targetX, spinDuration, pitch, centerOffset);

      const winCard = cardEls[deckData.winIndex];
      winCard.classList.add('winner-card');

      const winItem = deckData.winner;
      const plan = applyDeleteCountAndMorphWords(textarea.value, job.info, winItem.count, job.caret);
      statsRolled++;

      outcomeBanner.className = 'outcome-banner win-delete';
      outcomeBanner.textContent = `[${winItem.tier.toUpperCase()}] Deleted ${winItem.count} char${winItem.count === 1 ? '' : 's'}` +
        (plan && plan.newSpanText && plan.newSpanText !== plan.oldSpanText ? ` → "${plan.newSpanText}"` : '');
      updateCounts(textarea.value);

      if (!['epic', 'legendary', 'mythic'].includes(winItem.tier)) {
        triggerImpactShake(5, 240);
      }
      showRarityCelebration(winItem.tier, winItem.pct);

      const winRect = winCard.getBoundingClientRect();
      spawnOutwardConfetti(winRect.left + winRect.width / 2, winRect.top + winRect.height / 2, winItem.tier, true);
      playOutcomeSound(winItem.tier, true);

      const isHighTier = ['epic', 'legendary', 'mythic'].includes(winItem.tier);
      const holdMs = turboMode
        ? (isHighTier ? 1050 : 560)
        : (winItem.tier === 'mythic' ? 2250 : winItem.tier === 'legendary' ? 1950 : 1200);
      await sleep(holdMs);

      if (plan) {
        await executeEditorMorph({
          spanStart: plan.spanStart,
          spanEnd: plan.spanEnd,
          oldSpanText: plan.oldSpanText,
          newSpanText: plan.newSpanText,
          theme: 'red'
        });
      } else {
        document.body.classList.remove('modal-active');
        backdrop.classList.remove('open');
      }
    }

    /* =========================================================================
       13. SHARED POP-INTO-TEXT & SMOOTH BLUE/RED MORPH ANIMATION
       ========================================================================= */
    async function executeEditorMorph({ spanStart, spanEnd, oldSpanText, newSpanText, theme }) {
      const before = textarea.value.slice(0, spanStart);
      const after = textarea.value.slice(spanEnd);
      const isRed = theme === 'red';

      mirror.innerHTML =
        escapeHtml(before) +
        `<span id="active-target-word" class="token-lock-target">${escapeHtml(oldSpanText)}</span>` +
        escapeHtml(after) +
        '\n';
      mirror.scrollTop = textarea.scrollTop;

      const targetSpan = document.getElementById('active-target-word');
      const targetRect = targetSpan.getBoundingClientRect();
      const oldWidth = targetRect.width;
      const newWidth = newSpanText.length > 0 ? measureTextWidth(newSpanText) : 0;

      const modalRect = modal.getBoundingClientRect();
      const dx = (targetRect.left + targetRect.width / 2) - (modalRect.left + modalRect.width / 2);
      const dy = (targetRect.top + targetRect.height / 2) - (modalRect.top + modalRect.height / 2);

      playPopIntoSound();
      textarea.classList.add('anim-hide-caret');
      targetSpan.classList.add(isRed ? 'pre-red' : 'pre-blue');

      modal.classList.add('pop-into-editor');
      modal.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(0.06)`;
      document.body.classList.remove('modal-active');
      backdrop.classList.remove('open');

      await sleep(320);

      modal.classList.remove('pop-into-editor');
      modal.style.transform = '';
      resetRarityVisuals();
      stripEl.innerHTML = '';

      const curSelStart = textarea.selectionStart;
      const curSelEnd = textarea.selectionEnd;
      const delta = newSpanText.length - oldSpanText.length;

      const updatedFullText = before + newSpanText + after;
      textarea.value = updatedFullText;
      lastText = updatedFullText;

      if (isRed) {
        const newCaret = spanStart + newSpanText.length;
        textarea.setSelectionRange(newCaret, newCaret);
        markAllCompletedAsSettled(updatedFullText);
        if (newSpanText.length > 0) {
          settledSpans.push({ start: spanStart, end: spanStart + newSpanText.length, text: newSpanText });
        }
      } else {
        const nextCursorStart = curSelStart >= spanEnd ? curSelStart + delta : Math.min(curSelStart, spanStart + newSpanText.length);
        const nextCursorEnd = curSelEnd >= spanEnd ? curSelEnd + delta : Math.min(curSelEnd, spanStart + newSpanText.length);
        textarea.setSelectionRange(nextCursorStart, nextCursorEnd);
        shiftSpansAfterReplacement(spanStart, spanEnd, delta, newSpanText);
      }

      updateCounts(updatedFullText);

      mirror.innerHTML =
        escapeHtml(before) +
        `<span id="morph-pill" class="morph-pill" style="width:${oldWidth}px;">` +
          `<span id="morph-blur-bar" class="morph-blur-bar ${isRed ? 'red-theme' : ''} visible"></span>` +
          `<span id="morph-new-word" class="morph-new-word ${isRed ? 'red-theme' : ''}">${escapeHtml(newSpanText)}</span>` +
        `</span>` +
        escapeHtml(after) +
        '\n';
      mirror.scrollTop = textarea.scrollTop;

      const pillEl = document.getElementById('morph-pill');
      const barEl = document.getElementById('morph-blur-bar');
      const newWordEl = document.getElementById('morph-new-word');

      void pillEl.offsetWidth;

      requestAnimationFrame(() => {
        pillEl.style.width = `${newWidth}px`;
        newWordEl.classList.add('revealed');
        spawnEditorWordConfetti(pillEl.getBoundingClientRect(), theme);
      });

      await sleep(260);
      barEl.classList.add('fade-out');
      newWordEl.classList.remove('revealed');
      newWordEl.classList.add('settled');

      await sleep(400);
      renderPlainMirror(textarea.value);
      textarea.classList.remove('anim-hide-caret');
    }

    /* =========================================================================
       14. TOOLBAR CONTROLS
       ========================================================================= */
    document.getElementById('btn-skip-queue').addEventListener('click', () => {
      skipRemainingRequested = true;
      queueControls.style.display = 'none';
    });

    document.getElementById('btn-turbo').addEventListener('click', (e) => {
      turboMode = !turboMode;
      e.currentTarget.textContent = `Turbo: ${turboMode ? 'On' : 'Off'}`;
      e.currentTarget.classList.toggle('active-toggle', turboMode);
    });

    document.getElementById('btn-sfx').addEventListener('click', (e) => {
      sfxEnabled = !sfxEnabled;
      e.currentTarget.textContent = `SFX: ${sfxEnabled ? 'On' : 'Off'}`;
      e.currentTarget.classList.toggle('active-toggle', sfxEnabled);
    });

    document.getElementById('btn-new').addEventListener('click', () => {
      if (textarea.value.length > 0 && !confirm('Clear current .txt document and start fresh?')) return;
      releaseConfettiCanvas();
      stripEl.innerHTML = '';
      textarea.value = '';
      lastText = '';
      settledSpans = [];
      rollQueue = [];
      statsKept = 0;
      statsRolled = 0;
      filenameInput.value = 'untitled.txt';
      document.title = 'Untitled — Text Editor';
      renderPlainMirror('');
      textarea.focus();
    });

    filenameInput.addEventListener('input', () => {
      const name = filenameInput.value.trim() || 'Untitled';
      document.title = `${name} — Text Editor`;
    });

    const fileInput = document.getElementById('file-input');
    document.getElementById('btn-open').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const content = String(reader.result || '').replace(/\r\n/g, '\n');
        textarea.value = content;
        lastText = content;
        rollQueue = [];
        markAllCompletedAsSettled(content);
        const fname = file.name.endsWith('.txt') ? file.name : `${file.name}.txt`;
        filenameInput.value = fname;
        document.title = `${fname} — Text Editor`;
        renderPlainMirror(content);
        textarea.focus();
      };
      reader.readAsText(file);
      fileInput.value = '';
    });

    document.getElementById('btn-save').addEventListener('click', () => {
      let name = (filenameInput.value || 'untitled.txt').trim();
      if (!name.toLowerCase().endsWith('.txt')) name += '.txt';
      const blob = new Blob([textarea.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    renderPlainMirror('');
    textarea.focus();
  })();
  </script>
